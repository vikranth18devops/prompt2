global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ai-studio-monitor'

rule_files:
  - "alert.rules.yml"

scrape_configs:
  # 1. Scrape Next.js Application Health & Telemetry Endpoint
  - job_name: 'ai-studio-app'
    metrics_path: '/api/health'
    scrape_interval: 10s
    static_configs:
      - targets: ['web:3000', 'localhost:3000', 'host.docker.internal:3000']

  # 2. Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 3. Node Exporter (Host System Metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 4. cAdvisor (Container Resource Metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
