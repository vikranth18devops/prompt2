apiVersion: 1

datasources:
  # 1. Prometheus Metrics Data Source
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # 2. Loki Log Aggregation Data Source
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  # 3. Elasticsearch Data Source (ELK Stack)
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "logstash-*"
    jsonData:
      esVersion: "8.11.0"
      timeField: "@timestamp"
      logMessageField: "message"
    editable: true
