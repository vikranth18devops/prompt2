version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: ai_studio_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: ai_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Next.js Web Studio & Admin Application
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai_studio_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgrespassword123@db:5432/ai_platform?schema=public"
      ADMIN_EMAIL: "admin@azure-ai.com"
      ADMIN_PASSWORD: "AdminPass123!"
      JWT_SECRET: "super-secret-admin-key-azure-ai-2026"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
